
[env:esp32c3_juan_minima_diy]
extends = esp32c3_base
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv

build_flags =
  ${esp32c3_base.build_flags}
  -D PRIVATE_HW
  -D MESHTASTIC_VARIANT=esp32c3_juan_minima_diy
  -I variants/esp32c3/diy/esp32c3_juan_minima_diy
  -D ADC_ATTENUATION=ADC_ATTEN_DB_12
  -D DISABLE_OTA

  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
board_level = extra
