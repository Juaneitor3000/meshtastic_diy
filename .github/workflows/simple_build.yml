name: Build ESP32C3 Minima DIY

on:
  push:
    branches:
      - release_v2.7.15_juan_mod
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Firmware
        run: |
          pio run -e esp32c3_juan_minima_diy

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3_juan_minima_diy_firmware
          path: .pio/build/esp32c3_juan_minima_diy/*
          
